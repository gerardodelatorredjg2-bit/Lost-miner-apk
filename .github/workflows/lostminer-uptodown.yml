name: Acquire LostMiner 1.6.4 from Uptodown

on:
  push:
    paths:
      - ".github/workflows/lostminer-uptodown.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download architecture packages
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          APP = "https://lostminer.en.uptodown.com/android"
          HOST = "https://lostminer.en.uptodown.com"
          S = requests.Session()
          S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36"})
          def get(url):
              r=S.get(url,timeout=60)
              print("GET",r.status_code,r.url,r.headers.get("content-type"),len(r.content),flush=True)
              r.raise_for_status()
              return r

          home=get(APP).text
          soup=BeautifulSoup(home,"html.parser")
          app_node=soup.select_one("#detail-app-name")
          if not app_node or not app_node.get("data-code"):
              raise SystemExit("No se pudo leer data-code de Uptodown")
          code=app_node["data-code"]
          print("Uptodown app code:",code,flush=True)

          version_item=None
          for i in range(1,21):
              try:
                  payload=get(f"{APP}/apps/{code}/versions/{i}").json()
              except Exception as e:
                  print("version endpoint",i,"not usable:",str(e)[:200],flush=True)
                  continue
              version_item=next((x for x in (payload.get("data") or []) if str(x.get("version"))=="1.6.4"),None)
              if version_item:
                  print("Found version record:",json.dumps(version_item,ensure_ascii=False)[:2000],flush=True)
                  break
          if not version_item:
              raise SystemExit("No se encontró LostMiner 1.6.4")

          vu=version_item.get("versionURL") or {}
          version_url="/".join([str(vu.get("url","")).rstrip("/"),str(vu.get("extraURL","")).strip("/"),str(vu.get("versionID",""))])
          version_html=get(version_url).text
          vs=BeautifulSoup(version_html,"html.parser")
          variant_button=vs.select_one(".button.variants")
          data_version=variant_button.get("data-version") if variant_button else None
          if not data_version:
              raise SystemExit("No se encontró el ID del listado de variantes")

          files_payload=get(f"{HOST}/app/{code}/version/{data_version}/files").json()
          files_html=files_payload.get("content","")
          fs=BeautifulSoup(files_html,"html.parser")
          container=fs.select_one(".content")
          candidates=[]
          current_arch=""
          if container:
              for node in container.find_all(recursive=False):
                  classes=node.get("class") or []
                  if "variant" not in classes:
                      current_arch=" ".join(node.stripped_strings)
                      continue
                  report=node.select_one(".v-report[data-file-id]")
                  ftype=node.select_one(".v-file span")
                  if report and "arm64-v8a" in current_arch and "armeabi-v7a" in current_arch:
                      candidates.append((report["data-file-id"],ftype.get_text(strip=True) if ftype else "unknown",current_arch))
          if not candidates:
              raise SystemExit("No se halló un paquete que incluya ARMv7 y ARM64")
          # Prefer the combined multi-ABI build and highest version-file ID.
          file_id,file_type,archs=sorted(candidates,key=lambda x:int(x[0]))[-1]
          print("Selected package:",file_id,file_type,archs,flush=True)

          page=get(f"{APP}/download/{file_id}-x").text
          ds=BeautifulSoup(page,"html.parser")
          button=ds.select_one("#detail-download-button")
          data_url=button.get("data-url") if button else None
          if not data_url:
              print("DOWNLOAD BUTTON:",str(button)[:5000] if button else "NO BUTTON",flush=True)
              raise SystemExit("Uptodown no expuso el enlace binario")
          download_url="https://dw.uptodown.com/dwn/"+data_url.lstrip("/")
          response=get(download_url)
          filename="LostMiner-1.6.4-ARMv7-ARM64.xapk" if file_type.lower()=="xapk" else "LostMiner-1.6.4-ARMv7-ARM64.apkm"
          Path(filename).write_bytes(response.content)
          with open("source-metadata.txt","w",encoding="utf-8") as f:
              f.write(f"package=com.fsilva.marcelo.lostminer\\nversion=1.6.4\\nfile_id={file_id}\\narchitectures={archs}\\nfilename={filename}\\nbytes={len(response.content)}\\nsource={response.url}\\n")
          print("SAVED",filename,len(response.content),flush=True)
          PY
      - name: Verify archive and split inventory
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          for p in sorted(Path(".").glob("LostMiner-1.6.4-*")):
              if p.suffix not in (".xapk",".apkm",".apks"): continue
              print("\n##",p.name,p.stat().st_size)
              with zipfile.ZipFile(p) as z:
                  for n in z.namelist():
                      if n.endswith(".apk") or n.endswith("manifest.json") or n.endswith("toc.pb"):
                          print(n)
          PY
      - name: Upload reference packages
        uses: actions/upload-artifact@v4
        with:
          name: LostMiner-1.6.4-Uptodown-ABI-sources
          path: |
            LostMiner-1.6.4-*
            source-metadata.txt
          if-no-files-found: error
          retention-days: 7
